# Production: a release moves prod up to main, and this rebuilds the live game
# on Cloudflare. Nothing is ever committed to prod directly.
on:
  push:
    branches:
      - prod

jobs:
  trigger_webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger external server
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
          -d '{"event": "push", "branch": "prod"}' \
          https://api.cloudflare.com/client/v4/workers/builds/deploy_hooks/6b1428cb-4b1f-4fca-a9b9-8b14271b5e4f
