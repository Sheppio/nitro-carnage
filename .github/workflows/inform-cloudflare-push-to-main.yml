# Development build: every push to main rebuilds Cloudflare's development copy.
# Production is built from prod instead (inform-cloudflare-push-to-prod.yml).
on:
  push:
    branches:
      - main

jobs:
  trigger_webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger external server
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
          -d '{"event": "push", "branch": "main"}' \
          https://api.cloudflare.com/client/v4/workers/builds/deploy_hooks/25898afe-3d11-472a-8332-5881ee2fd838
