on:
  push:
    branches:
      - main  # This ensures the workflow only runs for the main branch

jobs:
  trigger_webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger external server
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"event": "push", "branch": "main"}' \
          https://api.cloudflare.com/client/v4/workers/builds/deploy_hooks/6b1428cb-4b1f-4fca-a9b9-8b14271b5e4f
